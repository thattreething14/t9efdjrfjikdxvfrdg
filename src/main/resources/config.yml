#################
# TOWN SETTINGS #
#################

##############
# TOWN RANKS #
##############

# Define different ranks and their corresponding permissions
# If you wish to add more unique ranks hardcode it inside the TownRank, but make sure to specify the right priority.
ranks:
  # Default town rank
  MEMBER:
    permissions:
      - towns.leave
      - towns.balance.deposit
  OFFICER:
    permissions:
      - towns.rank.addremove
      - towns.leave
      - towns.balance.deposit
  COMAYOR:
    permissions:
      - towns.chunks.claim
      - towns.chunks.unclaim
      - towns.rank.addremove
      - towns.invite
      - towns.leave
      - towns.balance.deposit
      - towns.balance.withdraw
  ASSISTANT:
    permissions:
      - towns.chunks.claim
      - towns.chunks.unclaim
      - towns.rank.addremove
      - towns.invite
      - towns.leave
      - towns.balance.deposit
      - towns.balance.withdraw
      - towns.set.name
      - towns.set.description
  MAYOR:
    permissions:
      - towns.chunks.claim
      - towns.chunks.unclaim
      - towns.rank.addremove
      - towns.invite
      - towns.delete
      - towns.leave
      - towns.balance.deposit
      - towns.balance.withdraw
      - towns.set.name
      - towns.set.description

########################
# TOWN UPKEEP SETTINGS #
########################

# Has to be an integer value
# This will dictate the amount of money the town costs
# Uses the vault api
towncreatecost: 100
# Controls the town upkeep settings

townupkeep:
  # To disable town upkeep select false
  enabled: true
  # The time that this will be scheduled for
  time: "12:00"  # 24-hour format
  # For timezone lists use https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  # Normal time zones like just specifying utc or est won't work
  timeZone: "America/New_York"  # Specify the desired time zone (I live in New York, so I just set time zone to here)
  # Amount that will be taken from the town every day
  amount: 100.0  # Upkeep amount

#######################
# TOWN CHUNK SETTINGS #
#######################

# The currency cost to claim a single chunk for a town.
chunkcost: 16.0
# The initial number of chunks a town has when it is created
# basechunks plus 1 chunkspermember so if you have them both set at 8 your starting town will have 16).
basechunks: 8
# The number of additional chunks a town receives for each member in the town.
chunkspermember: 8